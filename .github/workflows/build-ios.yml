name: 🍎 Build & Distribute iOS

# Reusable workflow. Called by release-dev.yml / release-prod.yml.
# Builds a signed IPA for the requested flavor and (optionally) uploads it to
# TestFlight via the App Store Connect API key.
#
# Signing model: distribution certificate imported from a base64 secret, the
# flavor's provisioning profiles installed from base64 secrets, and the Xcode
# project switched to manual signing for the build. Two profiles are needed per
# flavor — one for Runner (<bundle-id>) and one for the TimerWidget extension
# (<bundle-id>.TimerWidget). The "Generate Entitlements" build phase in the
# Runner target reads AUTH0_DOMAIN + AIRBRIDGE_APP_NAME from the environment, so
# both are exported before the build.

on:
  workflow_call:
    inputs:
      flavor:             { required: true,  type: string }   # dev | staging | prod
      entrypoint:         { required: true,  type: string }   # lib/main_<flavor>.dart
      airbridge_app_name: { required: true,  type: string }   # webuddhist
      auth0_domain:       { required: true,  type: string }   # used by Generate Entitlements
      ios_bundle_id:      { required: true,  type: string }   # org.pecha.app[.dev]
      environment:        { required: false, type: string, default: '' }
      upload_to_store:    { required: false, type: boolean, default: true }
      version_name:       { required: false, type: string,  default: '' }   # CI-computed semver; falls back to pubspec when empty

permissions:
  contents: read

jobs:
  ios:
    name: iOS • ${{ inputs.flavor }}
    runs-on: macos-15
    environment: ${{ inputs.environment }}
    timeout-minutes: 75
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: 📝 Create .env files
        env:
          DEV_BASE_API_URL:       ${{ secrets.DEV_BASE_API_URL }}
          DEV_AUTH0_AUDIENCE:     ${{ secrets.DEV_AUTH0_AUDIENCE }}
          STAGING_BASE_API_URL:   ${{ secrets.STAGING_BASE_API_URL }}
          STAGING_AUTH0_AUDIENCE: ${{ secrets.STAGING_AUTH0_AUDIENCE }}
          BASE_API_URL:           ${{ secrets.BASE_API_URL }}
          LIBRARY_API_URL:        ${{ secrets.LIBRARY_API_URL }}
          LIBRARY_CHANTS_TAG_ID:  ${{ secrets.LIBRARY_CHANTS_TAG_ID }}
          AUTH0_AUDIENCE:         ${{ secrets.AUTH0_AUDIENCE }}
          DEV_POSTHOG_API_KEY:     ${{ secrets.DEV_POSTHOG_API_KEY }}
          STAGING_POSTHOG_API_KEY: ${{ secrets.STAGING_POSTHOG_API_KEY }}
          POSTHOG_API_KEY:         ${{ secrets.POSTHOG_API_KEY }}
        run: bash ci/scripts/create_env_files.sh

      - name: 🔐 Create ios/Flutter/Secrets.xcconfig (Airbridge)
        env:
          AIRBRIDGE_SDK_TOKEN: ${{ secrets.AIRBRIDGE_SDK_TOKEN }}
          AIRBRIDGE_APP_NAME:  ${{ inputs.airbridge_app_name }}
        run: bash ios/scripts/prepare_ci_secrets.sh

      - name: 🔥 Inject GoogleService-Info.plist (only if provided)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Injected ios/Runner/GoogleService-Info.plist from secret"
          else
            echo "No secret — assuming GoogleService-Info.plist is committed"
          fi

      - name: 🧩 Export entitlement env vars
        run: |
          # Consumed by the "Generate Entitlements" Xcode build phase.
          echo "AUTH0_DOMAIN=${{ inputs.auth0_domain }}"          >> "$GITHUB_ENV"
          echo "AIRBRIDGE_APP_NAME=${{ inputs.airbridge_app_name }}" >> "$GITHUB_ENV"

      - name: 📦 flutter pub get
        run: flutter pub get

      - name: 🍫 CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      - name: 🔑 Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          p12-password:    ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: 📄 Install provisioning profiles (app + TimerWidget)
        id: profile
        env:
          PROFILE_DEV:     ${{ secrets.IOS_PROVISION_PROFILE_DEV_BASE64 }}
          PROFILE_STAGING: ${{ secrets.IOS_PROVISION_PROFILE_STAGING_BASE64 }}
          PROFILE_PROD:    ${{ secrets.IOS_PROVISION_PROFILE_PROD_BASE64 }}
          WIDGET_DEV:      ${{ secrets.IOS_PROVISION_PROFILE_DEV_WIDGET_BASE64 }}
          WIDGET_STAGING:  ${{ secrets.IOS_PROVISION_PROFILE_STAGING_WIDGET_BASE64 }}
          WIDGET_PROD:     ${{ secrets.IOS_PROVISION_PROFILE_PROD_WIDGET_BASE64 }}
        run: |
          set -euo pipefail
          case "${{ inputs.flavor }}" in
            dev)     APP_B64="$PROFILE_DEV";     WIDGET_B64="$WIDGET_DEV" ;;
            staging) APP_B64="$PROFILE_STAGING"; WIDGET_B64="$WIDGET_STAGING" ;;
            prod)    APP_B64="$PROFILE_PROD";    WIDGET_B64="$WIDGET_PROD" ;;
            *) echo "::error::Unknown flavor"; exit 1 ;;
          esac
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local b64="$1" key="$2" plist uuid name
            if [ -z "$b64" ]; then
              echo "::error::No '$key' provisioning profile secret for flavor ${{ inputs.flavor }}"; exit 1
            fi
            echo "$b64" | base64 --decode > "$RUNNER_TEMP/$key.mobileprovision"
            plist=$(security cms -D -i "$RUNNER_TEMP/$key.mobileprovision")
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$plist")
            cp "$RUNNER_TEMP/$key.mobileprovision" "$PROFILES_DIR/$uuid.mobileprovision"
            echo "${key}_profile_name=$name" >> "$GITHUB_OUTPUT"
            echo "Installed $key profile '$name' ($uuid)"
          }

          install_profile "$APP_B64"    app
          install_profile "$WIDGET_B64" widget

      - name: ✍️ Switch project to manual signing
        run: |
          set -euo pipefail
          # Runner and the TimerWidget extension are separate signable targets with
          # distinct bundle IDs, so each needs its own profile. Leaving the widget on
          # automatic signing makes the archive fail with "No Accounts" on the runner.
          for spec in "Runner:${{ steps.profile.outputs.app_profile_name }}" \
                      "TimerWidget:${{ steps.profile.outputs.widget_profile_name }}"; do
            fastlane run update_code_signing_settings \
              use_automatic_signing:false \
              path:"ios/Runner.xcodeproj" \
              team_id:"${{ secrets.IOS_TEAM_ID }}" \
              code_sign_identity:"Apple Distribution" \
              profile_name:"${spec#*:}" \
              targets:"${spec%%:*}"
          done

      - name: 🧾 Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ inputs.ios_bundle_id }}</key>
              <string>${{ steps.profile.outputs.app_profile_name }}</string>
              <key>${{ inputs.ios_bundle_id }}.TimerWidget</key>
              <string>${{ steps.profile.outputs.widget_profile_name }}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: 🚫 Neutralize Crashlytics symbol-upload build phase (CI archive)
        run: |
          # Firebase is integrated via Swift Package Manager (not the Podfile),
          # so the "FlutterFire: flutterfire upload-crashlytics-symbols" Xcode
          # run-script phase resolves the Crashlytics `run` helper to an SPM
          # checkout path that doesn't exist at archive time. flutterfire then
          # aborts with "ProcessException: No such file or directory" and fails
          # the whole archive even though the app compiled. Symbol upload is
          # post-build telemetry and must not block a release, so swap that
          # phase's script for a no-op during the CI archive (dSYMs are still
          # produced and shipped in the IPA / build artifact).
          PBXPROJ=ios/Runner.xcodeproj/project.pbxproj
          perl -i -pe 's/shellScript = ".*";/shellScript = "echo CI Crashlytics upload-symbols phase disabled; exit 0";/ if /upload-crashlytics-symbols/' "$PBXPROJ"
          if grep -q -- '--upload-symbols-script-path' "$PBXPROJ"; then
            echo "::warning::Could not patch the Crashlytics build phase; relying on the absent flutterfire CLI to make it skip."
          else
            echo "Crashlytics symbol-upload build phase neutralized for the CI archive."
          fi

      - name: 🏗️ Build IPA (${{ inputs.flavor }})
        env:
          AIRBRIDGE_SDK_TOKEN: ${{ secrets.AIRBRIDGE_SDK_TOKEN }}
        run: |
          # Prefer the CI-computed version (release-prod), else fall back to pubspec.
          VERSION_NAME="${{ inputs.version_name }}"
          [ -z "$VERSION_NAME" ] && VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          OFFSET="${{ vars.BUILD_NUMBER_OFFSET || '100' }}"
          BUILD_NUMBER=$(( ${{ github.run_number }} + OFFSET ))
          echo "Building $VERSION_NAME (+$BUILD_NUMBER)"
          flutter build ipa --release \
            --flavor "${{ inputs.flavor }}" -t "${{ inputs.entrypoint }}" \
            --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.flavor }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: 🔥 Upload Crashlytics dSYMs
        if: ${{ inputs.upload_to_store }}
        run: |
          # The in-Xcode "upload-crashlytics-symbols" build phase is guarded to
          # never fail the archive; we upload dSYMs deliberately here, where the
          # CocoaPods run/upload-symbols tooling reliably exists.
          UPLOAD=ios/Pods/FirebaseCrashlytics/upload-symbols
          GSP=ios/Runner/GoogleService-Info.plist
          DSYM=$(find build/ios -name "*.dSYM" -path "*Runner*" | head -n1 || true)
          if [ -x "$UPLOAD" ] && [ -f "$GSP" ] && [ -n "$DSYM" ]; then
            echo "Uploading dSYM: $DSYM"
            "$UPLOAD" -gsp "$GSP" -p ios "$DSYM"
          else
            echo "Skipping dSYM upload (upload-symbols=$UPLOAD gsp=$GSP dsym=$DSYM)"
          fi

      - name: 🛫 Upload to TestFlight
        if: ${{ inputs.upload_to_store }}
        env:
          ASC_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY:       ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEY_B64=$(printf '%s' "$ASC_KEY" | base64 | tr -d '\n')
          cat > "$RUNNER_TEMP/asc_api_key.json" <<EOF
          {
            "key_id": "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key": "$KEY_B64",
            "is_key_content_base64": true,
            "in_house": false
          }
          EOF
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          echo "Uploading $IPA to TestFlight"
          fastlane run upload_to_testflight \
            api_key_path:"$RUNNER_TEMP/asc_api_key.json" \
            ipa:"$IPA" \
            skip_waiting_for_build_processing:true
