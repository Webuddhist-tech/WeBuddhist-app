name: ✅ CI

# Fast feedback on every PR into develop or main: static analysis, tests.
# No signing, no store credentials — keeps PRs cheap and runnable from forks.

on:
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: 📝 Create placeholder .env files
        run: |
          for e in dev staging prod; do
            printf 'BASE_API_URL=\nLIBRARY_API_URL=\nLIBRARY_CHANTS_TAG_ID=\nAUTH0_SCHEME=\nAUTH0_AUDIENCE=\nENVIRONMENT=%s\n' "$e" > ".env.$e"
          done

      - name: 📦 flutter pub get
        run: flutter pub get

      - name: 🌍 Verify Tolgee bridge is up to date
        run: dart run tool/generate_tolgee_bridge.dart --check

      - name: 🩺 Check ARB consistency
        run: dart run tool/tolgee_sync.dart doctor

      - name: 🔍 Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Test
        run: flutter test
